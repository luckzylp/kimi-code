name: Auto Native Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.32.0). Defaults to v<package.json version>.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: auto-native-release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
          else
            VERSION="$(node -p "require('./apps/kimi-code/package.json').version")"
            TAG="v${VERSION}"
          fi
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

  native-build:
    needs: resolve
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-native
      retention-days: 7
      sign-macos: false

  publish:
    needs: [resolve, native-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kimi-code-native-*
          path: dist-native-release
          merge-multiple: true
      - name: Produce manifest.json
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: node apps/kimi-code/scripts/native/produce-manifest.mjs dist-native-release "$RELEASE_TAG"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease \
              --title "$RELEASE_TAG" \
              --notes "Auto-built native binaries for $RELEASE_TAG (linux/darwin/win32 x x64/arm64)." \
              --target "$GITHUB_SHA"
          fi
      - name: Upload assets to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist-native-release/* --clobber
